<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apkc-web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0d141c; color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px 8px; flex: none; }
  .cuenta { display: flex; align-items: baseline; gap: 10px; font-size: 20px; color: #8b98a5; }
  .cuenta b { font-size: 34px; line-height: 1; color: #f0b429; }
  .bar { height: 12px; background: #1f2a36; border-radius: 7px; overflow: hidden; margin-top: 8px; }
  .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2ea043, #56d364); transition: width .5s; }
  /* El trabajo en curso va arriba del todo y con su propio color: no es una tarea más. */
  #ahora {
    display: none; margin-top: 10px; padding: 10px 14px;
    border-left: 6px solid #f0b429; background: #2a210d; border-radius: 8px;
  }
  #ahora.visible { display: block; }
  #ahora .etiqueta {
    display: block; font-size: 12px; letter-spacing: .16em;
    text-transform: uppercase; color: #f0b429;
  }
  #ahora .texto { display: block; font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 3px; }
  main { flex: 1; overflow-y: auto; padding: 4px 16px 48px; scroll-behavior: smooth; }
  h2 { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: #6e7b8a; margin: 12px 0 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #1a2430; font-size: 24px; line-height: 1.2; }
  li .box { flex: none; width: 28px; text-align: center; font-size: 22px; }
  li .texto { flex: 1; }
  li .detalle { display: block; font-size: 15px; color: #8b98a5; margin-top: 3px; line-height: 1.25; }
  li.hecho { opacity: .42; font-size: 18px; }
  li.hecho .box { font-size: 17px; }
  #hechos { display: none; }
  #hechos.visible { display: block; }
  #toggle {
    margin: 12px 0 0; font-size: 15px; background: none; border: 1px solid #304050;
    color: #8b98a5; padding: 6px 10px; border-radius: 7px; font-family: inherit;
  }
  .pie { flex: none; font-size: 13px; color: #6e7b8a; padding: 2px 16px 8px; }
  #fs {
    position: fixed; right: 12px; top: 10px; z-index: 9;
    background: #1f2a36; color: #e6edf3; border: 0; border-radius: 8px;
    font-size: 20px; line-height: 1; padding: 6px 10px;
  }
  .vacio { color: #8b98a5; font-size: 20px; padding: 18px 0; }
</style>

<header>
  <div class="cuenta"><b id="pendientes">–</b><span id="resumen">pendientes</span></div>
  <div class="bar"><span id="barra"></span></div>
  <div id="ahora">
    <span class="etiqueta">Ahora mismo</span>
    <span class="texto" id="ahora-texto"></span>
  </div>
</header>
<main id="lista"><p class="vacio">Cargando…</p></main>
<div class="pie" id="pie"></div>
<button id="fs" title="pantalla completa">⛶</button>

<script>
(() => {
  const lista = document.getElementById("lista");
  const pie = document.getElementById("pie");
  const cuenta = document.getElementById("pendientes");
  const resumen = document.getElementById("resumen");
  const barra = document.getElementById("barra");
  const cajaAhora = document.getElementById("ahora");
  const textoAhora = document.getElementById("ahora-texto");
  let ultimaClave = "";

  const nodo = (tag, clase, texto) => {
    const n = document.createElement(tag);
    if (clase) n.className = clase;
    if (texto !== undefined) n.textContent = texto;
    return n;
  };

  function actual(estado) {
    const valor = typeof estado === "string" ? estado.trim() : "";
    if (valor) {
      textoAhora.textContent = valor;
      cajaAhora.classList.add("visible");
    } else {
      textoAhora.textContent = "";
      cajaAhora.classList.remove("visible");
    }
    return valor;
  }

  function fila(item, enCurso) {
    const li = nodo("li", item.done ? "hecho" : (enCurso ? "en-curso" : "pendiente"));
    li.appendChild(nodo("span", "box", item.done ? "✅" : (enCurso ? "▸" : "⬜")));
    const texto = nodo("span", "texto", item.text || "");
    if (item.detail) texto.appendChild(nodo("span", "detalle", item.detail));
    li.appendChild(texto);
    return li;
  }

  function pintar(items, actualTexto) {
    const pendientes = items.filter((i) => !i.done);
    const hechos = items.filter((i) => i.done);
    // el que está en la caja de arriba no se repite en la lista; la cuenta lo sigue contando.
    // Se compara el texto entero: con el primer tramo, «Producto · A1 …» ocultaba todos los
    // pendientes que empezaban por «Producto».
    const resto = pendientes.filter((i) => String(i.text) !== String(actualTexto || ""));
    cuenta.textContent = String(pendientes.length);
    resumen.textContent = "pendientes · " + hechos.length + " hechos";
    barra.style.width = (items.length ? (100 * hechos.length) / items.length : 0) + "%";

    lista.replaceChildren();
    lista.appendChild(nodo("h2", "", "Pendientes"));
    if (!resto.length) {
      lista.appendChild(nodo("p", "vacio", "Nada pendiente por aquí."));
    } else {
      const ul = document.createElement("ul");
      for (const item of resto) ul.appendChild(fila(item, false));
      lista.appendChild(ul);
    }

    if (hechos.length) {
      const boton = nodo("button", "", "ver " + hechos.length + " hechos");
      boton.id = "toggle";
      const caja = nodo("div", "");
      caja.id = "hechos";
      caja.appendChild(nodo("h2", "", "Hechos"));
      const ul = document.createElement("ul");
      for (const item of hechos) ul.appendChild(fila(item, false));
      caja.appendChild(ul);
      boton.addEventListener("click", () => {
        caja.classList.toggle("visible");
        boton.textContent = caja.classList.contains("visible")
          ? "ocultar los " + hechos.length + " hechos"
          : "ver " + hechos.length + " hechos";
      });
      lista.appendChild(boton);
      lista.appendChild(caja);
    }

    // el primer pendiente es lo primero que se ve; la caja de «ahora» ya está fija arriba
    const primero = lista.querySelector("li.pendiente");
    if (primero) primero.scrollIntoView({ block: "center", behavior: "smooth" });
    else lista.scrollTo({ top: 0, behavior: "smooth" });

    pie.textContent = "Actualizado " + new Date().toLocaleTimeString();
  }

  async function tick() {
    try {
      const r = await fetch("tareas.json?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) {
        const estado = await r.json();
        const items = Array.isArray(estado.items) ? estado.items : [];
        const ahora = String(estado.actual || "");
        const clave = JSON.stringify([ahora, items]);
        if (clave !== ultimaClave) {
          ultimaClave = clave;
          actual(ahora);
          pintar(items, ahora);
        }
      }
    } catch (e) {
      // si falla, se conserva lo último
    }
    setTimeout(tick, 2000);
  }

  function pantallaCompleta() {
    const el = document.documentElement;
    if (document.fullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      return;
    }
    const p = el.requestFullscreen && el.requestFullscreen({ navigationUI: "hide" });
    if (p && p.catch) p.catch(() => {
      // sin gesto del usuario el navegador lo rechaza: se reintenta con el primer toque
    });
  }

  // Android exige un gesto para entrar en pantalla completa. El primer toque en cualquier sitio
  // la pide una vez; el botón ⛶ sigue ahí para alternar cuando ya se está dentro.
  let pedida = false;
  const pedirConGesto = () => {
    if (pedida || document.fullscreenElement) return;
    pedida = true;
    pantallaCompleta();
  };
  document.addEventListener("pointerdown", pedirConGesto, { once: true });
  document.addEventListener("keydown", pedirConGesto, { once: true });
  document.getElementById("fs").addEventListener("click", pantallaCompleta);
  // Chrome exige un gesto; si el navegador lo permite al cargar, entra solo. Si no, el
  // botón ⛶ de la esquina queda para un toque desde la pantalla secundaria.
  window.addEventListener("load", () => setTimeout(pantallaCompleta, 400));

  tick();
})();
</script>
</html>
