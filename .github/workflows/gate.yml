name: gate

# El CI no es la guía del desarrollo: es la red que impide publicar una regresión. El job
# rápido da señal en cada push; el pesado corre el mismo e2e.sh que se usa en Termux, pero con
# el SDK de Android de Google y un Chrome de escritorio. El release tiene que depender del
# pesado (docs/plan.md, fase E).
on:
  push:
    branches: ["web", "main"]
  pull_request:
  workflow_dispatch:

env:
  APKC_REPO: ${{ github.workspace }}/apkc

jobs:
  rapido:
    runs-on: ubuntu-latest
    # Permiso mínimo: leer el repo para el checkout y los submodules. Ningún job de abajo escribe
    # en GitHub salvo `publicar`, que declara contents: write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: sintaxis de todos los módulos
        run: |
          for f in studio/*.js shim/*.js; do node --check "$f"; done
      - name: pruebas de node (plantillas, zip, reglas, undo tree, fusión)
        run: node studio/prueba.js

  pesado:
    needs: rapido
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          # Pin explícito: `go.mod` solo declara el mínimo (`go 1.24`) y dejaría que el runner
          # cambiara de versión sin que este repo lo viera.
          go-version: '1.24.0'
          cache-dependency-path: apkc/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          # 17, no 21: el `d8` de build-tools 34.0.0 (el que instala el paso del SDK) rechaza
          # los .class de javac 21 con "Unsupported class file major version 65". En Termux el
          # d8 de 34.9.0 sí los lee; el CI usa el build-tools de Google y necesita javac 17.
          java-version: "17"
      - name: caché del SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/android-sdk
          key: android-sdk-34.0.0-v1
      - name: SDK limpio con solo la plataforma 34
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
      - name: Chrome de escritorio
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1
        with:
          chrome-version: stable
      - name: verificar la suma de wasm_exec.js
        # Guion que aporta W2: se invoca desde la raíz, antes de copiar el fichero del GOROOT.
        run: sh tools/wasm-exec-hash.sh
      - name: binarios de apkc (nativo y wasm)
        run: |
          mkdir -p "$RUNNER_TEMP/apkc-web-tmp"
          (cd apkc && go build -o "$RUNNER_TEMP/apkc-gate" .)
          (cd apkc && GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -o "$RUNNER_TEMP/apkc-wasm.wasm" .)
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" studio/wasm_exec.js
      - name: keystore de depuración
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: oráculo zipcheck (apkc-harness)
        run: |
          git clone --depth 1 https://github.com/Leonisaurov/apkc-harness.git "$RUNNER_TEMP/apkc-harness"
          echo "APKC_HARNESS=$RUNNER_TEMP/apkc-harness" >> "$GITHUB_ENV"
      - name: oráculo bundletool
        run: |
          mkdir -p "$RUNNER_TEMP/bundletool"
          JAR="$RUNNER_TEMP/bundletool/bundletool-all-1.18.3.jar"
          curl -fsSL -o "$JAR" \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          # Suma medida en local sobre las dos copias disponibles (.github/workflows/ENDURECER.md).
          # Si falla, el paso falla y el gate no sigue con un jar manipulado.
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $JAR" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$JAR" >> "$GITHUB_ENV"
      - name: gate completo
        env:
          PREFIX: ${{ runner.temp }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          APKC: ${{ runner.temp }}/apkc-gate
          APKC_WASM: ${{ runner.temp }}/apkc-wasm.wasm
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$PREFIX/tmp"
          sh studio/e2e.sh
      - name: subir el log si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gate-logs
          path: |
            ${{ runner.temp }}/tmp/*.log
          if-no-files-found: ignore
      - name: preparar el sitio estático
        env:
          APKC_WASM: ${{ runner.temp }}/apkc-wasm.wasm
        run: sh tools/sitio.sh "$RUNNER_TEMP/sitio"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sitio
          path: ${{ runner.temp }}/sitio

  # WebKit es el motor de Safari. Esta comprobación corre en un runner Linux con el WebKit de
  # Playwright; el job `safari` repite la prueba en macos-latest con el WebKit de Playwright y dice
  # qué ejecutable se usó. Los dos son informativos por la misma razón (§181).
  webkit:
    needs: pesado
    runs-on: ubuntu-latest
    continue-on-error: true
    # Canal entre jobs: el summary es por job y `verificar-informativos` no puede leerlo.
    outputs:
      marcador: ${{ steps.marcador.outputs.marcador }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      # `npx -y ... install` deja el paquete en la caché de npm, no en node_modules: sin este paso
      # `import("playwright")` de prueba-webkit.js falla y el trabajo se omite solo (falso verde).
      - run: npm install --no-save --no-package-lock playwright@latest
      - run: npx playwright install webkit --with-deps
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sitio
          path: sitio
      - name: WebKit sobre el sitio publicado
        id: webkit
        shell: bash
        run: |
          set +e
          node studio/prueba-webkit.js 2>&1 | tee "$RUNNER_TEMP/webkit.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: marcador informativo
        id: marcador
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/webkit.log"
          rc="${{ steps.webkit.outputs.rc }}"
          if [ -z "$rc" ]; then rc=1; fi
          if grep -q 'sin playwright' "$log" 2>/dev/null; then
            resultado=omitido
            comprobaciones=0
          else
            comprobaciones=$(grep -cE '^  (ok|FALLA) ' "$log" 2>/dev/null || true)
            if [ -z "$comprobaciones" ]; then comprobaciones=0; fi
            if grep -q 'todo en orden' "$log" 2>/dev/null; then
              resultado=todo-en-orden
            else
              resultado=$(sed -n 's/^webkit: //p' "$log" 2>/dev/null | tail -1)
              if [ -z "$resultado" ]; then resultado=sin-resultado; fi
            fi
          fi
          marcador="webkit|resultado=$resultado|comprobaciones=$comprobaciones|rc=$rc"
          echo "marcador=$marcador" >> "$GITHUB_OUTPUT"
          echo "$marcador"

  # El WebKit de Playwright se puede automatizar; la app Safari no. En macos-latest lo que se
  # ejecuta es el motor WebKit empaquetado por Playwright, que es el mismo motor pero no la app
  # de Apple. Por eso el job informa de la identidad del ejecutable y captura el rc real de la
  # prueba: sin evidencia de que se corra otra cosa no tiene sentido exigirlo como gate (§181).
  safari:
    needs: pesado
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      marcador: ${{ steps.marcador.outputs.marcador }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sitio
          path: sitio
      - name: Playwright y su WebKit
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install webkit
      - name: identidad del motor (WebKit de Playwright)
        id: safari_info
        run: node tools/safari-info.mjs 2>&1 | tee "$RUNNER_TEMP/safari-info.log"
      - name: el sitio sobre WebKit en macOS
        id: prueba_webkit
        env:
          SITIO_DIR: ${{ github.workspace }}/sitio
        shell: bash
        run: |
          set +e
          node studio/prueba-webkit.js 2>&1 | tee "$RUNNER_TEMP/safari-webkit.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: marcador informativo
        id: marcador
        if: always()
        shell: bash
        run: |
          log="$RUNNER_TEMP/safari-info.log"
          ejecutable=$(sed -n 's/^ejecutable: //p' "$log" 2>/dev/null | tail -1)
          if [ -z "$ejecutable" ]; then ejecutable=desconocido; fi
          if grep -q '^de Playwright: si' "$log" 2>/dev/null; then
            motor=playwright-webkit
          else
            motor=sin-identidad
          fi
          rc="${{ steps.prueba_webkit.outputs.rc }}"
          if [ -z "$rc" ]; then rc=1; fi
          marcador="safari|motor=$motor|ejecutable=$ejecutable|rc=$rc"
          echo "marcador=$marcador" >> "$GITHUB_OUTPUT"
          echo "$marcador"
      - name: por qué este job no bloquea
        if: failure()
        run: |
          echo "safari: informativo. Se mide el WebKit de Playwright en macOS, no la app Safari."
          echo "Un fallo aquí no impide la release: el marcador informa del motor y del rc real."

  # ART de verdad: un emulador x86_64 con KVM ejecuta app_process64 y dexdump sobre los dex del
  # banco (banco/art.sh). KVM depende del hardware del runner y arrancar un system-image puede
  # fallar por razones ajenas al código, así que el job es continue-on-error y `publicar` no
  # depende de él: informa, no bloquea. Sin /dev/kvm se omite y se dice por qué.
  art:
    needs: rapido
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 50
    outputs:
      marcador: ${{ steps.marcador.outputs.marcador }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          # Pin explícito: `go.mod` solo declara el mínimo (`go 1.24`) y dejaría que el runner
          # cambiara de versión sin que este repo lo viera.
          go-version: '1.24.0'
          cache-dependency-path: apkc/go.sum
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: KVM del runner
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=si" >> "$GITHUB_OUTPUT"
            echo "KVM disponible: el emulador puede arrancar con aceleración"
          else
            echo "kvm=no" >> "$GITHUB_OUTPUT"
            echo "KVM no disponible: /dev/kvm no existe o no es legible/escribible."
            echo "Sin KVM un system-image x86_64 no arranca en tiempo razonable; se omite el banco ART."
          fi
      - name: SDK y emulador con KVM
        if: steps.kvm.outputs.kvm == 'si'
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          sudo chmod a+rw /dev/kvm
          SDKM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "emulator" \
            "platforms;android-34" "build-tools;34.0.0" "system-images;android-34;google_apis;x86_64"
          AVM=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/avdmanager 2>/dev/null | sort -V | tail -1)
          echo no | "$AVM" create avd -n apkc-art \
            -k "system-images;android-34;google_apis;x86_64" --device pixel_5
          nohup "$ANDROID_HOME/emulator/emulator" -avd apkc-art -no-window -no-audio \
            -no-boot-anim -gpu swiftshader_indirect -accel on >"$RUNNER_TEMP/emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" start-server
          listo=no
          for i in $(seq 1 120); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              listo=si
              break
            fi
            sleep 5
          done
          echo "emulador arrancado: $listo"
          [ "$listo" = "si" ]
          "$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk
      - name: banco ART (app_process64 y dexdump)
        id: banco
        if: steps.kvm.outputs.kvm == 'si'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          # JAVA_HOME lo exporta actions/setup-java para los pasos siguientes; no se copia aquí.
          APKC: ${{ runner.temp }}/apkc-art
          # El AVD se elige solo desde la configuración del runner. Sin esta variable art.sh sigue
          # en la Blackview por WiFi y su guard rechaza el emulador antes de compilar.
          ADB_SERIAL: ${{ vars.ART_ADB_SERIAL }}
        shell: bash
        run: |
          set +e
          (cd apkc && go build -o "$RUNNER_TEMP/apkc-art" .)
          rc=$?
          if [ "$rc" -eq 0 ]; then
            sh banco/art.sh
            rc=$?
          fi
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: subir el log del emulador si falla
        if: failure() && steps.kvm.outputs.kvm == 'si'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: art-emulator-log
          path: ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
      - name: marcador informativo
        id: marcador
        if: always()
        shell: bash
        run: |
          kvm="${{ steps.kvm.outputs.kvm }}"
          rc="${{ steps.banco.outputs.rc }}"
          if [ "$kvm" != 'si' ]; then
            marcador='art|kvm=no|omitido=si'
          elif [ -z "$rc" ]; then
            marcador='art|kvm=si|omitido=si'
          elif [ "$rc" = '0' ]; then
            marcador='art|kvm=si|banco=rc0'
          else
            marcador="art|kvm=si|banco=rc$rc|fallo=si"
          fi
          echo "marcador=$marcador" >> "$GITHUB_OUTPUT"
          echo "$marcador"
      - name: por qué este job no bloquea
        if: failure()
        run: |
          echo "art: informativo. Falló el arranque con KVM, el SDK/emulador o el banco ART."
          echo "La firma y la página ya están verificadas por los jobs rapido y pesado; publicar no depende de art."

  # Contrato de los jobs informativos: cada uno deja un marcador en sus propias salidas. Este job
  # no exige que pasen (§181): solo que informen de qué ocurrió y que una omisión tenga causa.
  # No tiene `continue-on-error`: un marcador ausente o una omisión sin causa sí es un fallo.
  # `publicar` sigue dependiendo únicamente de `pesado`, así que esto no bloquea la release.
  verificar-informativos:
    needs: [webkit, safari, art]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: comprobar los marcadores
        env:
          MARCA_WEBKIT: ${{ needs.webkit.outputs.marcador }}
          MARCA_SAFARI: ${{ needs.safari.outputs.marcador }}
          MARCA_ART: ${{ needs.art.outputs.marcador }}
        shell: bash
        run: |
          w=${MARCA_WEBKIT:-}
          s=${MARCA_SAFARI:-}
          a=${MARCA_ART:-}
          printf 'webkit: %s\n' "$w"
          printf 'safari: %s\n' "$s"
          printf 'art:    %s\n' "$a"

          # Extracción regex: cada marcador es una lista de campos clave=valor separados por '|'.
          campo() { # marcador clave -> valor (vacío si el campo no está)
            printf '%s' "$1" | grep -oE "(^|\\|)$2=[^|]*" | head -1 | sed 's/^[^=]*=//' || true
          }
          fallos=0
          fallar() { echo "$1"; fallos=$((fallos+1)); }

          # webkit: terminó en orden, con comprobaciones reales y rc cero.
          if [[ "$w" != webkit\|* ]]; then
            fallar "falta el marcador de webkit"
          else
            res=$(campo "$w" resultado)
            comp=$(campo "$w" comprobaciones)
            rcw=$(campo "$w" rc)
            [ "$res" = 'todo-en-orden' ] || fallar "webkit: resultado=$res (se exige todo-en-orden)"
            if ! [[ "$comp" =~ ^[0-9]+$ ]]; then
              fallar "webkit: comprobaciones='$comp' (se exige un número)"
            elif [ "$comp" -lt 1 ]; then
              fallar "webkit: comprobaciones=$comp (se exige >=1)"
            fi
            [ "$rcw" = '0' ] || fallar "webkit: rc=$rcw (se exige rc=0)"
          fi

          # safari: WebKit de Playwright identificado por su ejecutable y rc cero.
          if [[ "$s" != safari\|* ]]; then
            fallar "falta el marcador de safari"
          else
            motor=$(campo "$s" motor)
            exe=$(campo "$s" ejecutable)
            rcs=$(campo "$s" rc)
            [ "$motor" = 'playwright-webkit' ] || fallar "safari: motor=$motor (se exige playwright-webkit)"
            exe_conocido=no
            if [ -n "$exe" ] && [ "$exe" != 'desconocido' ] &&
               printf '%s' "$exe" | grep -qiE 'playwright'; then
              exe_conocido=si
            fi
            [ "$exe_conocido" = 'si' ] || fallar "safari: ejecutable='$exe' (no es conocido)"
            [ "$rcs" = '0' ] || fallar "safari: rc=$rcs (se exige rc=0)"
          fi

          # art: KVM real, banco en orden y sin omisión ni fallo.
          if [[ "$a" != art\|* ]]; then
            fallar "falta el marcador de art"
          else
            kvm=$(campo "$a" kvm)
            banco=$(campo "$a" banco)
            [ "$kvm" = 'si' ] || fallar "art: kvm=$kvm (se exige kvm=si)"
            [ "$banco" = 'rc0' ] || fallar "art: banco=$banco (se exige banco=rc0)"
            [ "$(campo "$a" omitido)" != 'si' ] || fallar "art: omitido=si (se prohíbe)"
            [ "$(campo "$a" fallo)" != 'si' ] || fallar "art: fallo=si (se prohíbe)"
          fi

          if [ "$fallos" -ne 0 ]; then
            echo "$fallos problema(s) en el contrato de marcadores"
          fi
          [[ "$fallos" -eq 0 ]]

  # El release no puede saltarse el gate: si el pesado falla, este job no arranca. Publica el
  # sitio empaquetado como artefacto de la release; el host definitivo sigue sin decidirse.
  publicar:
    needs: pesado
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sitio
          path: sitio
      - name: publicar el artefacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sitio && zip -qr ../apkc-studio.zip .
          gh release create "$GITHUB_REF_NAME" ../apkc-studio.zip --generate-notes
