name: gate

# El CI no es la guía del desarrollo: es la red que impide publicar una regresión. El job
# rápido da señal en cada push; el pesado corre el mismo e2e.sh que se usa en Termux, pero con
# el SDK de Android de Google y un Chrome de escritorio. El release tiene que depender del
# pesado (docs/plan.md, fase E).
on:
  push:
    branches: ["web", "main"]
  pull_request:
  workflow_dispatch:

jobs:
  rapido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: sintaxis de todos los módulos
        run: |
          for f in studio/*.js shim/*.js; do node --check "$f"; done
      - name: pruebas de node (plantillas, zip, reglas, undo tree, fusión)
        run: node studio/prueba.js

  pesado:
    needs: rapido
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apkc/go.mod
          cache-dependency-path: apkc/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: SDK y build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Chrome de escritorio
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: binarios de apkc (nativo y wasm)
        run: |
          mkdir -p "$RUNNER_TEMP/apkc-web-tmp"
          (cd apkc && go build -o "$RUNNER_TEMP/apkc-gate" .)
          (cd apkc && GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -o "$RUNNER_TEMP/apkc-wasm.wasm" .)
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" studio/wasm_exec.js
      - name: keystore de depuración
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: gate completo
        env:
          PREFIX: ${{ runner.temp }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          APKC: ${{ runner.temp }}/apkc-gate
          APKC_WASM: ${{ runner.temp }}/apkc-wasm.wasm
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$PREFIX/tmp"
          sh studio/e2e.sh
      - name: subir el log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            ${{ runner.temp }}/tmp/*.log
          if-no-files-found: ignore
      - name: preparar el sitio estático
        run: |
          mkdir -p sitio
          cp -r studio/. sitio/
          cp "$RUNNER_TEMP/apkc-wasm.wasm" sitio/apkc.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: sitio

  # El release no puede saltarse el gate: si el pesado falla, este job no arranca. Publica el
  # sitio empaquetado como artefacto de la release; el host definitivo sigue sin decidirse.
  publicar:
    needs: pesado
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: sitio
      - name: publicar el artefacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd sitio && zip -qr ../apkc-studio.zip .
          gh release create "$GITHUB_REF_NAME" ../apkc-studio.zip --generate-notes
